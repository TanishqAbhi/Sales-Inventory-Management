{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-heading"><div><h1>{% if is_edit %}Edit{% else %}Add{% endif %} {{ title }}</h1></div></div>
<section class="panel form-panel">
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions">
        <button class="button button-primary" type="submit">Save</button>
        <a class="button button-light" href="{% url 'record_list' model_key %}">Cancel</a>
    </div>
</form>
</section>
{% endblock %}
