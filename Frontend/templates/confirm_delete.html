{% extends "base.html" %}
{% block title %}Delete Record{% endblock %}
{% block content %}
<section class="panel form-panel">
    <h1>Delete Record</h1>
    <p>Are you sure you want to delete <strong>{{ object }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button class="button button-danger" type="submit">Yes, Delete</button>
        <a class="button button-light" href="{% url 'record_list' model_key %}">Cancel</a>
    </form>
</section>
{% endblock %}
