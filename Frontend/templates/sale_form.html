{% extends "base.html" %}
{% block title %}Create Sale{% endblock %}
{% block content %}
<div class="page-heading"><div><h1>Create Sale</h1><p>Select a product and quantity.</p></div></div>
<section class="panel form-panel">
<form method="post">
    {% csrf_token %}
    <label for="customer">Customer (optional)</label>
    <select name="customer" id="customer">
        <option value="">Walk-in customer</option>
        {% for customer in customers %}
        <option value="{{ customer.pk }}">{{ customer.name }}</option>
        {% endfor %}
    </select>

    <label for="product">Product</label>
    <select name="product" id="product" required>
        <option value="">Select a product</option>
        {% for product in products %}
        <option value="{{ product.pk }}">{{ product.name }} — ₹{{ product.selling_price }} (Stock: {{ product.stock_quantity }})</option>
        {% endfor %}
    </select>

    <label for="quantity">Quantity</label>
    <input type="number" name="quantity" id="quantity" min="1" value="1" required>

    <button class="button button-primary" type="submit">Complete Sale</button>
</form>
</section>
{% endblock %}
